<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Learning · Runkaro</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="bg-scene" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span><div class="grid-overlay"></div></div>
  <header id="site-nav" class="site-nav glass"></header>

  <main class="container">
    <section class="page-hero">
      <span class="glass-chip">🎓 My learning</span>
      <h1>My <span class="grad-text">courses</span></h1>
      <p class="muted">Everything you're enrolled in, in one place.</p>
    </section>
    <div class="grid" id="grid"></div>
  </main>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav('learning');
    (async () => {
      if (!Auth.isLoggedIn()) { location.href = 'login.html?next=' + encodeURIComponent('my-learning.html'); return; }
      const grid = document.getElementById('grid');
      try {
        const { courses } = await api('/courses/mine');
        if (courses.length) grid.innerHTML = courses.map(courseCard).join('');
        else grid.innerHTML = `<div class="empty"><div class="big">🎓</div><p>You haven't enrolled in any courses yet.</p><a class="btn btn-primary" style="margin-top:16px" href="courses.html">Browse courses</a></div>`;
      } catch (e) { grid.innerHTML = emptyHTML(e.message, '⚠️'); }
    })();
  </script>
</body>
</html>
