<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Runkaro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="bg-scene" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span><div class="grid-overlay"></div></div>
  <header id="site-nav" class="site-nav glass"></header>

  <main class="auth-wrap">
    <form class="glass auth-card" id="register-form" novalidate>
      <a class="brand" href="index.html"><span class="brand-orb">R</span><span class="brand-name">Run<span class="grad-text">karo</span></span></a>
      <h1>Create your account</h1>
      <p class="muted sub">Anyone can join — it only takes a few seconds.</p>
      <div class="field"><label for="name">Full name</label><input id="name" type="text" required placeholder="Ada Lovelace" autocomplete="name" /></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com" autocomplete="email" /></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" /></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" required placeholder="Repeat your password" autocomplete="new-password" /></div>
      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
      <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
      <div class="demo-box" id="demo-box">
        <p class="demo-title">⚡ Just exploring? Use the demo admin</p>
        <div class="demo-row"><span class="who">Admin</span><code>admin@runkaro.com / Admin@123</code><button type="button" class="btn btn-mini" data-goto="login">Sign in</button></div>
      </div>
    </form>
  </main>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav(null);
    // Demo-credentials box is a local-development convenience — hide it on any public host.
    if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.getElementById('demo-box')?.remove();
    }
    if (Auth.isLoggedIn()) location.replace(Auth.isAdmin() ? 'dashboard.html' : 'courses.html');
    document.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => location.href = 'login.html'));
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { toast('Passwords do not match', 'error'); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        const { token, user } = await api('/auth/register', { method: 'POST', body: { name, email, password } });
        Auth.save(token, user);
        toast(`Welcome to Runkaro, ${user.name}!`, 'success');
        setTimeout(() => { location.href = 'courses.html'; }, 600);
      } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
    });
  </script>
</body>
</html>
